name: autoluxe-local
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: caradmin
      POSTGRES_PASSWORD: "${PGPASSWORD:?Set PGPASSWORD in backend/.env}"
      POSTGRES_DB: car_rental_db
    ports:
      - "127.0.0.1:5555:5432"
    volumes:
      - car_rental_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./backend/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: caradmin
      PGPASSWORD: "${PGPASSWORD:?Set PGPASSWORD in backend/.env}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in backend/.env}"
      BOOKING_HOLD_HOURS: "${BOOKING_HOLD_HOURS:-24}"
      BOOKING_MAX_PENDING_PER_CUSTOMER: "${BOOKING_MAX_PENDING_PER_CUSTOMER:-3}"
      BOOKING_MAX_RENTAL_DAYS: "${BOOKING_MAX_RENTAL_DAYS:-30}"
      PGDATABASE: car_rental_db
      PORT: 5000

volumes:
  car_rental_data:
    external: true
    name: "${RENTAL_DB_VOLUME:-car-rental-system-walid_car_rental_data}"
