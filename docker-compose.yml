services:
  db:
    image: postgres:16
    container_name: car_rental_db
    restart: always
    environment:
      POSTGRES_USER: caradmin
      POSTGRES_PASSWORD: carpass123
      POSTGRES_DB: car_rental_db
    ports:
      - "5555:5432"
    volumes:
      - car_rental_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: car_rental_backend
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: caradmin
      PGPASSWORD: carpass123
      PGDATABASE: car_rental_db
      PORT: 5000

volumes:
  car_rental_data:
